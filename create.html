<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ink Your Imagination — Book Page</title>
  <style>
    :root{
      --header-yellow: #0a0a0a;
      --page-cream: #757369;
      --bg-cream: hsl(47, 36%, 90%);
    }
    html,body{
      height:100%;
      margin:0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-cream);
      color:#000000;
    }
    header{
      background: var(--header-yellow);
      display:flex;
      align-items:center;
      gap:16px;
      padding:12px 28px;
      flex-wrap:wrap;
    }
    .logo{ display:flex; align-items:center; gap:10px; min-width:160px; }
    .logo img{ height:54px; border-radius:6px; background:#fff; padding:4px; }
    .search-wrap{ flex:1 1 380px; display:flex; justify-content:center; }
    .search-wrap input{ width:100%; max-width:520px; padding:9px 14px; border-radius:24px; border:1px solid rgba(0,0,0,0.12); font-size:14px; }
    nav{ display:flex; gap:18px; align-items:center; font-weight:600; }
    nav a{ text-decoration:none; color:#111; font-size:14px; }

    main{ padding:28px; text-align:center; }
    h1{ margin:6px 0 22px 0; font-family:'Georgia',serif; letter-spacing:1px; }
    .canvas-wrap{ display:flex; justify-content:center; }
    .page-card{ padding:18px; border-radius:8px; max-width:920px; width:100%; }
    canvas#bookPage{
      width:100%; max-width:780px; height:auto;
      border-radius:4px; box-shadow:0 8px 24px rgba(0,0,0,0.12);
      display:block; margin:0 auto; background:var(--page-cream);
      border:1px solid rgba(0,0,0,0.06);
    }
    .btns{ margin-top:16px; display:flex; gap:12px; justify-content:center; }
    button{ padding:8px 16px; border:none; border-radius:6px; background:#ddd8d8; cursor:pointer; font-weight:600; }
    button:hover{ background:#202020; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="images/logo.png" alt="Logo">
    <div>
      <div style="font-weight:800;">INK</div>
      <div style="font-size:12px;margin-top:-4px;">Your Imagination</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="search" placeholder="Search Your Books" aria-label="Search Your Books" />
  </div>
  <nav>
    <a href="website.html">HOME</a>
    <a href="books.html">BOOK</a>
    <a href="create.html">CREATE NEW</a>
    <a href="login.html">LOGIN</a>
  </nav>
</header>

<main>
  <h1>INK YOUR IMAGINATION</h1>
  <div class="canvas-wrap">
    <div class="page-card">
      <canvas id="bookPage" width="780" height="620" role="img" aria-label="Book page preview" tabindex="0"></canvas>
      <div class="btns">
        <button id="editBtn">Edit</button>
        <button id="postBtn">Post</button>
      </div>
    </div>
  </div>
</main>

<script>
const canvas = document.getElementById('bookPage');
const ctx = canvas.getContext('2d');
let currentText = "";
let cursorVisible = true;

// Draw page
function drawPage(text){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background
  ctx.fillStyle = '#fff8dc';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Title
  ctx.fillStyle = '#111';
  ctx.font = `${Math.round(canvas.width*0.03)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('Chapter 1 — Beginning', canvas.width/2, 28);

  // Margin line
  const marginLeft = Math.round(canvas.width*0.06);
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.beginPath();
  ctx.moveTo(marginLeft+6,82);
  ctx.lineTo(marginLeft+6,canvas.height-36);
  ctx.stroke();

  // Text settings
  ctx.fillStyle = '#222';
  const fontSize = Math.round(canvas.width*0.0185);
  ctx.font = `${fontSize}px Georgia`;
  ctx.textAlign = 'start'; // left-align text
  const lineHeight = Math.round(fontSize*1.6);
  const maxWidth = canvas.width - marginLeft - Math.round(canvas.width*0.06);
  const topY = 110;
  const bottomY = canvas.height - 40;

  // Wrap text into lines
  let words = text.replace(/\n/g,' \n ').split(/\s+/);
  let lines=[], line="";
  words.forEach(w=>{
    if(w==='\n'){ lines.push(line.trim()); line=""; return; }
    let test=line+w+" ";
    if(ctx.measureText(test).width>maxWidth && line!==""){
      lines.push(line.trim()); line=w+" ";
    } else { line=test; }
  });
  if(line) lines.push(line.trim());

  // Limit lines to fit vertically
  const maxLines = Math.floor((bottomY - topY)/lineHeight);
  if(lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    let lastLine = lines[lines.length-1];
    while(ctx.measureText(lastLine + '…').width > maxWidth && lastLine.length>0){
      lastLine = lastLine.slice(0,-1);
    }
    lines[lines.length-1] = lastLine + '…';
  }

  // Draw lines
  let y = topY;
  lines.forEach(l => { ctx.fillText(l, marginLeft+16, y); y += lineHeight; });

  // Cursor (if last line visible)
  if(cursorVisible && lines.length>0){
    const lastLine = lines[lines.length-1];
    const cursorX = marginLeft+16 + ctx.measureText(lastLine).width;
    const cursorY = topY + (lines.length-1)*lineHeight;
    ctx.fillRect(cursorX, cursorY, 2, lineHeight);
  }

  return maxLines; // return max lines to limit input
}

// Keyboard input
canvas.addEventListener('keydown', e=>{
  const maxLines = drawPage(currentText);
  const currentLines = currentText.split(/\n/).length;

  if(e.key.length===1){
    if(currentLines <= maxLines) currentText += e.key;
  }
  else if(e.key==='Backspace'){ currentText=currentText.slice(0,-1); }
  else if(e.key==='Enter'){
    if(currentLines < maxLines) currentText+='\n';
  }

  drawPage(currentText);
  e.preventDefault(); // prevent default scrolling
});

// Cursor blink
setInterval(()=>{ cursorVisible = !cursorVisible; drawPage(currentText); }, 500);

// Focus canvas on click
canvas.addEventListener('click', ()=>canvas.focus());

// Buttons
document.getElementById('editBtn').addEventListener('click', ()=>canvas.focus());
document.getElementById('postBtn').addEventListener('click', ()=>{
  if(currentText.trim()===""){ alert("You haven't written anything yet!"); return; }
  alert("Posted successfully!\n\n"+currentText);
});

// Make canvas focusable
canvas.tabIndex = 0;
canvas.focus();

// Initial draw
drawPage(currentText);
</script>

</body>
</html>
