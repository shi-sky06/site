<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ink&Imagination Login</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', sans-serif; }

  body {
    background-color: #fff176;
    min-height: 100vh;
    position: relative;
  }

  /* Navbar */
  nav.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #333;
    color: white;
    padding: 10px 30px;
    flex-wrap: wrap;
  }

  .nav-left { display: flex; align-items: center; gap: 10px; }
  .nav-left img { height:50px; width:auto; }
  .nav-left .logo-text { font-size:20px; font-weight:bold; }

  .nav-title { font-size:22px; font-weight:bold; flex:1; text-align:center; }
  .nav-links { list-style:none; display:flex; gap:20px; }
  .nav-links li a { color:rgb(189, 227, 236); text-decoration:none; font-weight:500; }
  .nav-links li a:hover { text-decoration:underline; }

  /* Login Modal */
  .modal {
    display: none; /* hidden by default */
    position: fixed;
    z-index: 100;
    left: 0; top: 0;
    width: 100%; height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.5);
  }

  .modal-content {
    background-color: #ffe8cc;
    margin: 100px auto;
    padding: 40px 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    position: relative;
  }

  .close-btn {
    position: absolute;
    right: 15px; top: 10px;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }

  .modal-content input[type="text"], .modal-content input[type="password"] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 20px;
    background-color: #fff;
  }

  .modal-content button {
    background-color: #a5d6a7;
    color: #000;
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
  }

  .signup { margin-top:15px; font-size:14px; }
  .signup a { color:#000; font-weight:bold; text-decoration:none; }

  .social-icons { margin-top:15px; font-size:20px; }
  .social-icons i { margin: 0 8px; cursor:pointer; }

  #login-result { margin-top:15px; font-weight:bold; }

  /* Responsive */
  @media (max-width:768px) {
    nav.navbar { flex-direction:column; text-align:center; }
    .nav-title { margin:10px 0; }
    .nav-links { flex-direction:column; gap:10px; }
  }
</style>
<!-- Font Awesome CDN -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-left">
    <img src="Images/logo.png" alt="Ink&Imagination Logo">
    <div class="logo-text">📚 Ink&Imagination</div>
  </div>

  <h1 class="nav-title">🖋️ Welcome to Ink&Imagination</h1>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="signup.html">Signup</a></li>
    <li><a href="books.html">Books</a></li>
    <li><a href="login.html" id="loginBtn">Login</a></li>
  </ul>
</nav>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModal">&times;</span>
    <h2>Welcome Back</h2>
    <p>Login to Continue</p>

    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <br>
    <button onclick="validateLogin()">Login</button>
    <p id="login-result"></p>

    <div class="signup">
      NEW HERE??? <a href="signup.html">SIGN UP</a>
    </div>

    <div class="social-icons">
      <i class="fab fa-google"></i>
      <i class="fab fa-facebook"></i>
      <i class="fab fa-apple"></i>
      <i class="fab fa-windows"></i>
    </div>
  </div>
</div>

<!-- JS -->
<script>
  // Modal functionality
  const loginBtn = document.getElementById("loginBtn");
  const modal = document.getElementById("loginModal");
  const closeModal = document.getElementById("closeModal");

  loginBtn.onclick = () => { modal.style.display = "block"; }
  closeModal.onclick = () => { modal.style.display = "none"; }
  window.onclick = (e) => { if(e.target == modal) modal.style.display = "none"; }

  // Login validation
  function validateLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const result = document.getElementById("login-result");

    if (username === "admin" && password === "1234") {
      result.textContent = "Login successful ✅";
      result.style.color = "green";
    } else {
      result.textContent = "Access denied ❌";
      result.style.color = "red";
    }
  }
</script>

</body>
</html>
